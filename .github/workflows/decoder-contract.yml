name: decoder-contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: decoder-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/mizufinance/shieldd-snarkpack-fv-toolchain@sha256:63fb57a0c07de6c4a3ded67410b26a2804d090a3ae51929708c8e4650a686282
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 decoder_contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-contract-report
          path: .work/decoder-contract-report/
          if-no-files-found: error
          retention-days: 30
