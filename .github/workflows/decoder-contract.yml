name: decoder-contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decoder-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned F* boundary tools
        run: bash decoder/install-tools.sh
      - run: python3 decoder_contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-contract-report
          path: .work/decoder-contract-report/
          if-no-files-found: error
          retention-days: 30
